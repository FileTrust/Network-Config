name: Build and publication checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_publication.py
      - name: Scan source and complete public history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --location --silent --show-error -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner
          /tmp/gitleaks git . --config .gitleaks.toml --log-opts=--all --redact=100 --no-banner
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check Python, JSON and installer syntax
        run: |
          python3 -c "import ast, json; from pathlib import Path; [ast.parse(p.read_text()) for p in Path('.').glob('*.py')]; json.loads(Path('config.default.json').read_text())"
          bash -n install.sh
      - name: Check standalone entry point and installer preview
        run: |
          python3 network_config_server.py --help
          bash install.sh --dry-run --no-service
